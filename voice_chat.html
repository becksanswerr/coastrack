<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coastrack - Voice AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-blue: #344CB7;
            --brand-cyan: #06B6D4;
            --brand-yellow: #EAB308;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: var(--card-bg);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-family: 'Anton', sans-serif;
            color: var(--brand-cyan);
            margin: 0;
            letter-spacing: 1px;
            font-size: 1.5rem;
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-bubble {
            align-self: flex-end;
            background: var(--brand-blue);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-bubble {
            align-self: flex-start;
            background: #334155;
            color: white;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .controls {
            padding: 15px 20px;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            gap: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--brand-cyan);
        }

        .send-btn {
            background: var(--brand-cyan);
            color: var(--bg-dark);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .mic-btn {
            background: var(--brand-blue);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(52, 76, 183, 0.4);
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn.listening {
            background: #EF4444;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
        }

        .mic-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
            min-height: 20px;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                color: rgba(255, 255, 255, 0);
                text-shadow: .25em 0 0 rgba(255, 255, 255, 0), .5em 0 0 rgba(255, 255, 255, 0);
            }

            40% {
                color: white;
                text-shadow: .25em 0 0 rgba(255, 255, 255, 0), .5em 0 0 rgba(255, 255, 255, 0);
            }

            60% {
                text-shadow: .25em 0 0 white, .5em 0 0 rgba(255, 255, 255, 0);
            }

            80%,
            100% {
                text-shadow: .25em 0 0 white, .5em 0 0 white;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1><i class="fa-solid fa-robot"></i> COAST-AI</h1>
    </div>

    <div class="chat-container" id="chat">
        <div class="bubble ai-bubble">Merhaba! Ben Coastrack Lunapark Asistanıyım. Sana park hakkında veya ziyaretçiler
            hakkında nasıl yardımcı olabilirim? (Konuşmak için mikrofona tıklayın)</div>
    </div>

    <div class="status" id="status-text">Sizi dinlemeye hazırım.</div>

    <div class="controls">
        <input type="text" id="chat-input" class="chat-input" placeholder="Mesajınızı yazın..."
            onkeypress="handleEnter(event)">
        <button class="send-btn" id="send-btn" onclick="sendText()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
        <button class="mic-btn" id="mic-btn" onclick="toggleListening()" title="Sesli Konuş">
            <i class="fa-solid fa-microphone"></i>
        </button>
    </div>

    <script>
        const chat = document.getElementById("chat");
        const micBtn = document.getElementById("mic-btn");
        const sendBtn = document.getElementById("send-btn");
        const chatInput = document.getElementById("chat-input");
        const statusText = document.getElementById("status-text");

        let recognition = null;
        let isListening = false;

        // Initialize Web Speech API
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function () {
                isListening = true;
                micBtn.classList.add("listening");
                statusText.innerText = "Sizi dinliyorum...";
            };

            recognition.onresult = async function (event) {
                const text = event.results[0][0].transcript;
                appendBubble(text, 'user');
                statusText.innerText = "Düşünüyor...";
                micBtn.disabled = true;
                micBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

                await sendToBackend(text);
            };

            recognition.onerror = function (event) {
                console.error("Speech recognition error", event.error);

                if (event.error === 'no-speech') {
                    statusText.innerText = "Ses algılanamadı, arka plan gürültüsü olabilir.";
                } else if (event.error === 'not-allowed') {
                    statusText.innerText = "Mikrofon izni verilmedi! Lütfen tarayıcıdan izin verin.";
                } else if (event.error === 'network') {
                    statusText.innerText = "Ağ hatası: Ses tanıma için internet bağlantısı gerekiyor.";
                } else {
                    statusText.innerText = "Hata oluştu: " + event.error;
                }
                stopListening();
            };

            recognition.onend = function () {
                stopListening();
            };
        } else {
            statusText.innerText = "Tarayıcınız ses tanımayı desteklemiyor.";
            micBtn.disabled = true;
        }

        function toggleListening() {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove("listening");
            if (statusText.innerText === "Sizi dinliyorum...") {
                statusText.innerText = "Sizi dinlemeye hazırım.";
            }
        }

        function handleEnter(event) {
            if (event.key === "Enter") {
                sendText();
            }
        }

        function sendText() {
            const text = chatInput.value.trim();
            if (text === "") return;

            chatInput.value = "";
            appendBubble(text, 'user');
            statusText.innerText = "Düşünüyor...";
            micBtn.disabled = true;
            sendBtn.disabled = true;

            sendToBackend(text);
        }

        function appendBubble(text, sender) {
            const bubble = document.createElement("div");
            bubble.className = `bubble ${sender}-bubble`;
            bubble.innerText = text;
            chat.appendChild(bubble);
            chat.scrollTop = chat.scrollHeight;
            return bubble;
        }

        async function sendToBackend(text) {
            try {
                const res = await fetch("/api/voice_chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text })
                });

                const data = await res.json();
                const reply = data.response || "Bağlantı hatası.";

                appendBubble(reply, 'ai');
                statusText.innerText = "Sizi dinlemeye hazırım.";

            } catch (err) {
                console.error(err);
                appendBubble("Bağlantı hatası. Lütfen sunucuyu kontrol edin.", 'ai');
                statusText.innerText = "Bağlantı hatası.";
            } finally {
                micBtn.disabled = false;
                sendBtn.disabled = false;
                micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
            }
        }
    </script>
</body>

</html>
